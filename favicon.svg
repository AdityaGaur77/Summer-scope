<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="SummerScope">
  <!-- An aperture. The ring is the accent token and the centre is the accent-2
       token: the same pair the site uses for a button and its hover, and the
       centre dot is the one in the wordmark. Simple geometry, because the
       smallest place this is ever seen is a 16px browser tab. The tile is
       darker than the site's own band colour so the mark keeps its presence
       against dark browser chrome.
       (No double hyphens in this comment: they are illegal inside an XML
       comment and silently make the whole file unrenderable as an image.) -->
  <rect width="64" height="64" rx="14" fill="#0E3B3D"/>
  <circle cx="32" cy="32" r="19" fill="none" stroke="#5CC2C4" stroke-width="6"/>
  <circle cx="32" cy="32" r="6.5" fill="#83D5D6"/>
</svg>
